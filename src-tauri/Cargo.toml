[package]
name = "poweri-desktop"
version = "0.2.0"
description = "Native desktop wrapper for the pi-web coding agent UI"
authors = ["tianzhao"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
open = "5"
tauri-plugin-clipboard-manager = "2.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
