name: Demo

# Builds the static Pi Web demo in demo/ and publishes it to GitHub Pages.
# Pull requests that touch the demo only build it.

on:
  push:
    branches: [main, poweri, desktop]
    paths:
      - "demo/**"
      - ".github/workflows/demo-pages.yml"
  pull_request:
    paths:
      - "demo/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      page_configured: ${{ steps.pages.outcome == 'success' }}
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          # "/<repo>" for a project site, empty for a custom domain.
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - if: github.event_name != 'pull_request' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/out

  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.page_configured == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
