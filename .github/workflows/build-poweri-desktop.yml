# Build the PowerI desktop app (Tauri shell in src-tauri/) on every relevant
# push and publish installer bundles to a GitHub Release on poweri-v* tags.
#
# Events:
#   - push to ANY branch touching src-tauri/**, shell/**, the build config,
#     or this file: build the platform matrix and upload bundles as preview
#     artifacts (kept for 14 days).
#   - push of a poweri-v* tag (from any branch) or manual dispatch: same
#     matrix plus a GitHub Release draft with the installers attached. The
#     tag version must match tauri.conf.json's "version".
#   - workflow_dispatch: build the selected branch only, no Release.
#
# No signing: macOS builds are ad-hoc/unsigned (xattr -cr or Developer ID
# before distribution) and Windows installers are unsigned (SmartScreen
# warns; sign with a code-signing cert for distribution).

name: Build PowerI desktop

on:
  workflow_dispatch:
  push:
    paths:
      - src-tauri/**
      - vite.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/build-poweri-desktop.yml
    tags:
      - poweri-v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build (release)
        run: npm run desktop -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: List bundle outputs
        shell: bash
        run: |
          echo '--- bundle dirs ---'
          find src-tauri/target -type d -name bundle -print
          echo '--- dmg/exe anywhere under target ---'
          find src-tauri/target \( -name '*.dmg' -o -name '*.exe' \) -print

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-bundles
          # Only tauri's bundle outputs (dmg/, nsis/ under any bundle dir);
          # the plain *.exe find also swept build-script and binary artifacts
          # from target/ into the release.
          find src-tauri/target -type f -path '*/bundle/*' \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} dist-bundles/ \;
          ls -la dist-bundles

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: poweri-${{ matrix.name }}
          path: dist-bundles/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/poweri-v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: bundles
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PowerI $GITHUB_REF_NAME" \
            --notes "Installers built by GitHub Actions. macOS builds are unsigned; remove the quarantine flag before first launch." \
            --draft