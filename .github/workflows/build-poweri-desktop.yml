# Build the PowerI desktop app (Tauri shell in src-tauri/) on every relevant
# push and publish installer bundles to a GitHub Release on release tags.
#
# Two release-tag formats (see docs/desktop/release.md):
#   - poweri-vX.Y.Z:      joint release — this workflow builds the shell AND
#                         publish-poweri-web.yml publishes the npm package
#                         (versions must agree).
#   - poweri-app-vX.Y.Z:  shell-only release — shell version may diverge
#                         from the npm package; npm publish is NOT triggered
#                         (the tag prefix does not match poweri-v*).
#
# Events:
#   - push to ANY branch touching src-tauri/**, shell/**, the build config,
#     or this file: build the platform matrix and upload bundles as preview
#     artifacts (kept for 14 days).
#   - push of either release tag (from any branch) or manual dispatch: same
#     matrix plus a GitHub Release draft with the installers attached. The
#     tag version (after stripping poweri-v / poweri-app-v) must match
#     tauri.conf.json's "version".
#   - workflow_dispatch: build the selected branch only, no Release.
#
# No signing: macOS builds are ad-hoc/unsigned (xattr -cr or Developer ID
# before distribution) and Windows installers are unsigned (SmartScreen
# warns; sign with a code-signing cert for distribution).

name: Build PowerI desktop

on:
  workflow_dispatch:
  push:
    paths:
      - src-tauri/**
      - vite.config.ts
      - package.json
      - package-lock.json
      - .github/workflows/build-poweri-desktop.yml
    tags:
      - poweri-v*
      - poweri-app-v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRIMARY_NODE_VERSION: '24'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            rust-target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macos-x64
            os: macos-latest
            rust-target: x86_64-apple-darwin
            bundles: dmg
          - name: windows-x64
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    # 90min cap: a hung unit test once held the Windows job for 6h until GitHub's
    # default timeout cancelled the whole run (2026-10-22, run 39763691289)
    # while macOS had already finished, so no Windows preview artifact shipped.
    # The test step bounds itself; this cap covers the bundling steps.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches tauri.conf.json version (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # bash 参数展开（${VAR#prefix}）；Windows 默认 pwsh 解析不了，9050a89 引入时在 branch push 上被 if 跳过未暴露
        run: |
          TAG="${GITHUB_REF_NAME#poweri-app-v}"
          TAG="${TAG#poweri-v}"
          APP=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "$APP" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $APP"
            exit 1
          fi

      - name: Run unit tests (web + shell, gate before bundle)
        # The web suite does not gate the bundle on Windows: ~79 of its cases
        # fail there for Windows-only reasons (file locks held during rmdir,
        # CRLF in source-text assertions, drive-letter paths handed to the ESM
        # loader, git temp paths under C:\Users\RUNNER~1), and upstream CI has
        # only ever run Linux and macOS, so they were never green here. The
        # suite still runs so those failures stay visible in the log, and
        # macOS keeps the hard gate.
        #
        # 25min cap + per-test timeout in `npm test`: without them a full run
        # took 6h (72 cases each waiting out a network timeout, 2026-10-22 run
        # 39763691289) and GitHub's default cap cancelled the whole run after
        # macOS had already finished, so no Windows installer shipped.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        timeout-minutes: 25
        run: |
          npm test
          npm run shell:test

      - name: Build (release)
        run: npm run desktop -- --target ${{ matrix.rust-target }} --bundles ${{ matrix.bundles }}

      - name: List bundle outputs
        shell: bash
        run: |
          echo '--- bundle dirs ---'
          find src-tauri/target -type d -name bundle -print
          echo '--- dmg/exe anywhere under target ---'
          find src-tauri/target \( -name '*.dmg' -o -name '*.exe' \) -print

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p dist-bundles
          # Only tauri's bundle outputs (dmg/, nsis/ under any bundle dir);
          # the plain *.exe find also swept build-script and binary artifacts
          # from target/ into the release.
          find src-tauri/target -type f -path '*/bundle/*' \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} dist-bundles/ \;
          ls -la dist-bundles

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: poweri-${{ matrix.name }}
          path: dist-bundles/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/poweri-v') || startsWith(github.ref, 'refs/tags/poweri-app-v')
    needs: build
    timeout-minutes: 15
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: bundles
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" bundles/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "PowerI $GITHUB_REF_NAME" \
            --notes "Installers built by GitHub Actions. macOS builds are unsigned; remove the quarantine flag before first launch." \
            --draft